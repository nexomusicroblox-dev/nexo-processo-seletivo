<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO • Painel Administrativo</title>
<style>
:root{--bg:#071126;--card:#0d1b3a;--card2:#111f43;--line:#26395f;--text:#f5f7ff;--muted:#9eaccb;--blue:#3b8cff;--purple:#7654ff;--green:#31d69b;--red:#ff5470}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#164eaa 0,transparent 35%),radial-gradient(circle at 90% 10%,#6b1ba8 0,transparent 32%),var(--bg);min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:28px 16px 60px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand h1{margin:0;letter-spacing:5px;font-size:32px}
.brand p{margin:6px 0 0;color:var(--muted)}
.card{background:#0b1735f2;border:1px solid #ffffff12;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px #0007}
.top{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.status{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;color:#fff}
.refresh{background:linear-gradient(90deg,var(--blue),var(--purple))}
.danger{background:#5b1e2c}
.content{padding:20px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:#cdd8f2;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
td{color:#edf2ff;font-size:14px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}
.pendente{background:#3d3315;color:#ffe79a}
.aprovado{background:#123b2e;color:#a8ffe0}
.reprovado{background:#471d2a;color:#ffb5c2}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.view{background:#223254}
.approve{background:#147957}
.reject{background:#8f2e43}
.empty{padding:45px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.open{display:flex}
.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:center}
.close{background:#26395f}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.detail{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px}
.detail strong{display:block;color:#9eaccb;font-size:12px;margin-bottom:5px}
.detail span{white-space:pre-wrap;word-break:break-word}
.full{grid-column:1/-1}.details h3{font-size:17px}
.login{max-width:520px;margin:80px auto;background:var(--card);padding:28px;border:1px solid var(--line);border-radius:22px}
.input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:#fff;margin:8px 0 14px}
.note{color:var(--muted);font-size:13px;line-height:1.5}
.error{color:#ff9bad;margin-top:10px}
.lembrar{display:flex;gap:10px;align-items:center;padding:13px 15px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin:12px 0;cursor:pointer;user-select:none;transition:all .2s ease}
.lembrar:hover{border-color:var(--blue)}
.lembrar input{width:18px;height:18px;cursor:pointer;accent-color:var(--blue)}
.lembrar.ativo{background:#152347;border-color:var(--blue);color:#c8d9ff;font-weight:700}
.aviso-sessao{background:#3d3315;border:1px solid #7a6320;color:#ffe79a;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:14px;display:none}
.aviso-sessao.ativo{display:block}
@media(max-width:700px){.details{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<div id="login" class="login">
  <h2>Acesso administrativo</h2>
  <p class="note">Painel da Nexo. Informe o email autorizado para entrar.</p>
  <input id="adminEmail" class="input" type="email" placeholder="nexomusicroblox@gmail.com">
  <button class="btn refresh" type="button" onclick="enterAdmin()">ENTRAR</button>
  <div id="loginError" class="error"></div>
</div>

<div id="app" class="wrap" style="display:none">
  <div id="avisoSessao" class="aviso-sessao"></div>
  <div class="header">
    <div class="brand">
      <h1>NEXO</h1>
      <p>Painel Administrativo • Processo Seletivo</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn close" type="button" onclick="esquecerDispositivo()" title="Esquecer este dispositivo">🔓 ESQUECER</button>
      <button class="btn danger" type="button" onclick="logout()">SAIR</button>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <div>
        <strong>Candidaturas</strong>
        <div id="status" class="status">Carregando...</div>
      </div>
      <button class="btn refresh" type="button" onclick="loadCandidates()">ATUALIZAR</button>
    </div>
    <div class="content">
      <div id="tableArea"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle">Candidatura</h2>
      <button class="btn close" type="button" onclick="closeModal()">FECHAR</button>
    </div>
    <div id="details" class="details"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwgd8fmu50eWy-SGo4bZwacACxOz1jRYlNrZgnrOcBqT8SUQOeWe3GbLK42jqKQvmptLQ/exec";
const ADMIN_EMAIL = "nexomusicroblox@gmail.com";
const LEMBRAR_TTL_MS = 30 * 24 * 60 * 60 * 1000;

let candidates = [];
let adminToken = localStorage.getItem("nexoPSAdminToken") || "";
let lembrarExpira = parseInt(localStorage.getItem("nexoPSLembrarExpira") || "0");
let lembrarMarcado = false;
let tokenExpiraEm = parseInt(localStorage.getItem("nexoPSTokenExpira") || "0");
/* ============ HELPERS ============ */
function show(id, visible) {
  document.getElementById(id).style.display = visible ? "" : "none";
}

function toggleLembrar() {
  lembrarMarcado = !lembrarMarcado;
  document.getElementById('inputLembrar').checked = lembrarMarcado;
  document.getElementById('labelLembrar').classList.toggle('ativo', lembrarMarcado);
}

/* ============ LOGIN ============ */
function enterAdmin() {
  const email = document.getElementById("adminEmail").value.trim().toLowerCase();
  const err = document.getElementById("loginError");
  err.textContent = "";

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    err.textContent = "Este email não possui permissão de administrador.";
    return;
  }

  const btn = document.querySelector("#login .refresh");
  btn.disabled = true;
  btn.textContent = "ENVIANDO CÓDIGO...";

  fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({action:"requestCode", email:email})
  })
  .then(r => r.json())
  .then(j => {
    if (!j.ok) throw new Error(j.error || "Não foi possível enviar o código.");
    sessionStorage.setItem("nexoPSAdminEmail", email);
    document.getElementById("login").innerHTML = `
      <h2>Verificação de segurança</h2>
      <p class="note">Enviamos um código de 6 dígitos para <strong>${ADMIN_EMAIL}</strong>.</p>
      <p class="note">O código expira em 10 minutos.</p>
      <input id="otp" class="input" inputmode="numeric" maxlength="6" placeholder="000000">
      <label class="lembrar" id="labelLembrar" onclick="toggleLembrar()">
        <input type="checkbox" id="inputLembrar" onclick="event.stopPropagation();toggleLembrar();">
        <span>🤝 Confiar neste dispositivo por 30 dias</span>
      </label>
      <button class="btn refresh" type="button" onclick="verifyCode()">VERIFICAR CÓDIGO</button>
      <button class="btn close" style="margin-left:8px" type="button" onclick="location.reload()">VOLTAR</button>
      <div id="loginError" class="error"></div>
    `;
    document.getElementById("otp").focus();
  })
  .catch(err => {
    err = document.getElementById("loginError");
    err.textContent = "Não foi possível enviar o código. Confira o Google Apps Script.";
  })
  .finally(() => {
    const b = document.querySelector("#login .refresh");
    if (b) { b.disabled = false; b.textContent = "ENTRAR"; }
  });
}

async function verifyCode() {
  const code = document.getElementById("otp").value.trim();
  const err = document.getElementById("loginError");
  err.textContent = "";

  if (!/^\d{6}$/.test(code)) {
    err.textContent = "Digite o código de 6 dígitos.";
    return;
  }

  const btn = document.querySelector("#login .refresh");
  btn.disabled = true;
  btn.textContent = "VERIFICANDO...";

  try {
    const r = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"verifyCode",
        email:sessionStorage.getItem("nexoPSAdminEmail") || ADMIN_EMAIL,
        code:code,
        lembrar:lembrarMarcado
      })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Código inválido.");

    adminToken = j.token;
    localStorage.setItem("nexoPSAdminToken", adminToken);
    localStorage.setItem("nexoPSAdminEmail", ADMIN_EMAIL);

    if (j.lembrar) {
      const expira = Date.now() + LEMBRAR_TTL_MS;
      localStorage.setItem("nexoPSLembrarExpira", expira.toString());
      lembrarExpira = expira;
    } else {
      localStorage.removeItem("nexoPSLembrarExpira");
      lembrarExpira = 0;
    }

    if (j.expiresIn) {
      const expira = Date.now() + (j.expiresIn * 1000);
      localStorage.setItem("nexoPSTokenExpira", expira.toString());
      tokenExpiraEm = expira;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    atualizarAvisoSessao();
    loadCandidates();
  } catch (e) {
    err.textContent = e.message || "Código inválido ou expirado.";
  } finally {
    btn.disabled = false;
    btn.textContent = "VERIFICAR CÓDIGO";
  }
}

function logout() {
  adminToken = "";
  localStorage.removeItem("nexoPSAdminToken");
  localStorage.removeItem("nexoPSAdminEmail");
  localStorage.removeItem("nexoPSLembrarExpira");
  localStorage.removeItem("nexoPSTokenExpira");
  lembrarExpira = 0;
  tokenExpiraEm = 0;
  location.reload();
}

async function esquecerDispositivo() {
  if (!confirm("Isso vai fazer com que este dispositivo peça código novamente na próxima vez. Continuar?")) return;
  try {
    if (adminToken) {
      await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"esquecerSessao", token:adminToken})
      });
    }
  } catch(e) {}
  localStorage.removeItem("nexoPSLembrarExpira");
  alert("Dispositivo esquecido. Você será deslogado.");
  logout();
}

/* ============ AVISO DE SESSÃO EXPIRANDO ============ */
function atualizarAvisoSessao() {
  const el = document.getElementById("avisoSessao");
  if (!el) return;
  if (tokenExpiraEm && tokenExpiraEm > Date.now()) {
    const msRestantes = tokenExpiraEm - Date.now();
    const horasRestantes = msRestantes / (60 * 60 * 1000);
    if (horasRestantes <= 24 && horasRestantes > 0) {
      el.classList.add("ativo");
      el.innerHTML = `⚠️ Sua sessão expira em <strong>${Math.ceil(horasRestantes)} hora(s)</strong>. Saia e faça login novamente para renovar.`;
      return;
    }
  }
  el.classList.remove("ativo");
}

/* ============ CARREGAR CANDIDATURAS ============ */
async function loadCandidates() {
  const status = document.getElementById("status");
  const area = document.getElementById("tableArea");
  status.textContent = "Carregando candidaturas...";
  area.innerHTML = "";

  try {
    const r = await fetch(API_URL + "?action=list&token=" + encodeURIComponent(adminToken));
    const j = await r.json();
    if (!j.ok) {
      if (j.error === "UNAUTHORIZED") throw new Error("Sessão expirada.");
      throw new Error(j.error || "Erro ao carregar");
    }
    candidates = Array.isArray(j.data) ? j.data : [];
    render();
    status.textContent = candidates.length + " candidatura(s) encontrada(s).";
  } catch (err) {
    if (String(err.message).includes("Sessão expirada")) {
      logout();
      return;
    }
    status.textContent = "Erro ao carregar.";
    area.innerHTML = '<div class="empty">Não foi possível carregar as candidaturas.<br><br>Confira se o Google Apps Script está implantado novamente após a atualização.</div>';
  }
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function badge(status) {
  const s = status || "Pendente";
  const cls = s === "Aprovado" ? "aprovado" : s === "Reprovado" ? "reprovado" : "pendente";
  return '<span class="badge '+cls+'">'+esc(s)+'</span>';
}

function render() {
  const area = document.getElementById("tableArea");
  if (!candidates.length) {
    area.innerHTML = '<div class="empty">Nenhuma candidatura encontrada.</div>';
    return;
  }
  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Nome</th><th>Email</th><th>Área</th><th>Data</th><th>Status</th><th>Ações</th>
      </tr></thead>
      <tbody>
        ${candidates.map((c,i)=>`
          <tr>
            <td><strong>${esc(c.nomeRP || c.nome || "-")}</strong></td>
            <td>${esc(c.email || "-")}</td>
            <td>${esc(Array.isArray(c.areas) ? c.areas.join(", ") : (c.areas || "-"))}</td>
            <td class="muted">${esc(c.timestamp || c.createdAt || "-")}</td>
            <td>${badge(c.status)}</td>
            <td><div class="actions">
              <button class="btn view" type="button" onclick="viewCandidate(${i})">VER</button>
              <button class="btn approve" type="button" onclick="decision(${i},'Aprovado')">APROVAR</button>
              <button class="btn reject" type="button" onclick="decision(${i},'Reprovado')">REPROVAR</button>
            </div></td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

function viewCandidate(i) {
  const c = candidates[i];

  document.getElementById("modalTitle").textContent =
    "Candidatura • " + (c.nomeRP || "Sem nome");

  const sections = [
    {
      title:"👤 Dados pessoais",
      fields:[
        ["Nome (RP)","nomeRP"],
        ["Idade (Vida Real)","idade"],
        ["E-mail","email"],
        ["Instagram","instagram"],
        ["Discord","discord"],
        ["Áreas de interesse","areas"],
        ["Outra área","outraArea"]
      ]
    },
    {
      title:"📋 Responsabilidades e requisitos",
      fields:[
        ["Responsabilidades — confirmação","leuResponsabilidades"],
        ["Requisitos — confirmação","aceitaRequisitos"]
      ]
    },
    {
      title:"❓ Perguntas fechadas",
      fields:[
        ["Você possui disponibilidade para cumprir os horários estabelecidos?","disponibilidade"],
        ["Você possui experiência trabalhando em equipe?","equipe"],
        ["Você já exerceu alguma função semelhante anteriormente?","experiencia"],
        ["Você está disposto(a) a receber orientações e treinamentos?","treinamento"],
        ["Você possui disponibilidade para reuniões ou treinamentos quando necessário?","reunioes"],
        ["Você consegue manter uma postura profissional durante o trabalho?","postura"]
      ]
    },
    {
      title:"💬 Perguntas abertas",
      fields:[
        ["Fale um pouco sobre você.","sobre"],
        ["Por que você deseja trabalhar na Nexo?","nexo"],
        ["Por que deveríamos selecionar você?","selecao"],
        ["Quais são seus principais pontos fortes?","fortes"],
        ["Qual é um ponto que você acredita que precisa melhorar?","melhorar"],
        ["Como você lidaria com um cliente insatisfeito?","cliente"],
        ["Como você agiria caso um membro da equipe não estivesse cumprindo suas responsabilidades?","equipeProblema"],
        ["Como você costuma lidar com críticas ou orientações de superiores?","criticas"],
        ["Conte uma situação em que você precisou trabalhar em equipe para resolver um problema.","situacao"],
        ["O que você espera aprender ou conquistar dentro da Nexo?","objetivos"]
      ]
    },
    {
      title:"📌 Processo",
      fields:[
        ["Status","status"],
        ["Data da candidatura","timestamp"],
        ["Declaração de veracidade","declaracao"]
      ]
    }
  ];

  let html = "";

  sections.forEach(section => {
    html += `
      <div class="full" style="margin-top:18px;margin-bottom:4px">
        <h3 style="margin:0;color:#fff">${section.title}</h3>
      </div>
    `;

    section.fields.forEach(([label,key]) => {
      let value = c[key];

      if (Array.isArray(value)) value = value.join(", ");
      if (value === undefined || value === null || value === "") value = "Não informado";

      html += `
        <div class="detail ${String(value).length > 180 ? "full" : ""}">
          <strong>${esc(label)}</strong>
          <span>${esc(value)}</span>
        </div>
      `;
    });
  });

  document.getElementById("details").innerHTML = html;
  document.getElementById("modal").classList.add("open");
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

async function decision(i, status) {
  const c = candidates[i];
  if (!c || !c.id) {
    alert("Esta candidatura não possui um ID válido.");
    return;
  }
  const nome = c.nomeRP || c.nome || "esta candidatura";
  if (!confirm("Tem certeza que deseja " + (status === "Aprovado" ? "aprovar " : "reprovar ") + nome + "?")) return;

  try {
    const r = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"decision",id:c.id,status:status,token:adminToken})
    });
    const j = await r.json();
    if (!j.ok) {
      if (j.error === "UNAUTHORIZED") { logout(); return; }
      throw new Error(j.error || "Falha");
    }
    alert(status === "Aprovado" ? "Candidatura aprovada. O email será enviado ao candidato." : "Candidatura reprovada. O email será enviado ao candidato.");
    await loadCandidates();
  } catch (err) {
    alert("Não foi possível registrar a decisão.");
  }
}

/* ============ INICIALIZAÇÃO ============ */
async function boot() {
  const agora = Date.now();
  const temLembrar = lembrarExpira > 0 && lembrarExpira > agora;
  const temToken = !!adminToken;

  if (temToken && temLembrar) {
    // Confia direto, sem validar (o backend valida quando a página faz uma request)
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    atualizarAvisoSessao();
    loadCandidates();
    return;
  }

  if (temToken && tokenExpiraEm && tokenExpiraEm > agora) {
    // Sessão normal ainda válida (menos de 30 min)
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    atualizarAvisoSessao();
    loadCandidates();
    return;
  }

  // Sem token válido — limpa e mostra login
  if (temToken) {
    localStorage.removeItem("nexoPSAdminToken");
    localStorage.removeItem("nexoPSTokenExpira");
    adminToken = "";
    tokenExpiraEm = 0;
  }
}

boot();
</script>
</body>
</html>
